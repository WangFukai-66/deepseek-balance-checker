<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提词器 TXT+DOCX 完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-size: 28px;
            height: 100vh;
            overflow: hidden;
        }
        .control {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            text-align: center;
        }
        button, input {
            font-size: 16px;
            padding: 6px 12px;
            margin: 0 5px;
        }
        input[type="file"] {
            color: #fff;
        }
        .scroll-wrap {
            width: 90%;
            height: calc(100vh - 70px);
            margin: 70px auto 0;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .text-content {
            line-height: 1.5;
            white-space: pre-wrap;
            padding: 20px 0;
        }
        /* 删除原来 scroll-running 的 overflow:hidden，不再锁住滚动 */
    </style>
    <script src="https://unpkg.com/mammoth@1.4.21/mammoth.browser.min.js"></script>
</head>
<body>
    <div class="control">
        <input type="file" id="fileInput" accept=".txt,.docx">
        <button id="start">开始滚动</button>
        <button id="pause">暂停</button>
        <button id="reset">重置</button>

        <label>滚动速度：</label>
        <input type="range" id="speed" min="0.5" max="20" step="0.5" value="4">

        <label>字体大小：</label>
        <input type="range" id="fontSizeSlider" min="16" max="80" value="28">

        <button id="fullscreen">全屏</button>
    </div>

    <div class="scroll-wrap" id="wrap">
        <div id="textContent" class="text-content">
请选择此电脑💻中的 .txt 或 .docx 文件
        </div>
    </div>

    <script>
        const textDom = document.getElementById('textContent');
        const startBtn = document.getElementById('start');
        const pauseBtn = document.getElementById('pause');
        const resetBtn = document.getElementById('reset');
        const speedDom = document.getElementById('speed');
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const fullscreenBtn = document.getElementById('fullscreen');
        const fileInput = document.getElementById('fileInput');
        const wrap = document.getElementById('wrap');

        let isRunning = false;
        let animateId = null;
        let speed = 4;

        // 读取电脑中的文件
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();
            resetAll();

            if (fileName.endsWith('.txt')) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    textDom.innerText = evt.target.result;
                };
                reader.readAsText(file);
            } else if (fileName.endsWith('.docx')) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const arrayBuffer = evt.target.result;
                    mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                        .then(function(result) {
                            textDom.innerText = result.value;
                        })
                        .catch(function(err) {
                            alert("读取docx失败：" + err.message);
                        });
                };
                reader.readAsArrayBuffer(file);
            } else {
                alert("仅支持 .txt 和 .docx 格式！");
            }
        });

        // 滚动速度
        speedDom.addEventListener('input', e => {
            speed = Number(e.target.value);
        });

        // 字体大小
        fontSizeSlider.addEventListener('input', e => {
            textDom.style.fontSize = e.target.value + 'px';
        });

        // 统一暂停
        function pauseScroll() {
            isRunning = false;
            cancelAnimationFrame(animateId);
        }

        // 滚动逻辑：改用 scrollTop 替代 transform
        function scrollText() {
            const maxScroll = wrap.scrollHeight - wrap.clientHeight;
            // 滚到底部停止，不循环
            if (wrap.scrollTop >= maxScroll) {
                pauseScroll();
                return;
            }
            wrap.scrollTop += speed;
            animateId = requestAnimationFrame(scrollText);
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                scrollText();
            }
        });

        pauseBtn.addEventListener('click', pauseScroll);

        function resetAll() {
            pauseScroll();
            wrap.scrollTop = 0;
        }
        resetBtn.addEventListener('click', resetAll);

        // 全屏
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
